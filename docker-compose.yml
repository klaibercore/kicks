services:
  kicks:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./output:/app/output
    environment:
      # Which drum the server starts on. Others load lazily on first request,
      # so a single container can serve all three once they are trained.
      - KICKS_INSTRUMENT=kick
      # Directory roots. Per-instrument paths are derived from these.
      - KICKS_DATA_DIR=/app/data
      - KICKS_MODEL_DIR=/app/models
      - KICKS_OUTPUT_DIR=/app/output
      - KICKS_VOCODER=bigvgan
      - KICKS_CONTROL=descriptor
      # Origins the website is served from (local dev, GitHub Pages, custom domain).
      - KICKS_CORS_ORIGINS=http://localhost:3000
      # Accounts and credits. Leave unset for an open, local-only server.
      # - KICKS_SUPABASE_URL=https://<ref>.supabase.co
      # - KICKS_SUPABASE_SERVICE_KEY=<service_role key — never the anon key>
      # - KICKS_SUPABASE_JWT_SECRET=<only for legacy HS256 projects>
      # - KICKS_AUTH_MODE=required
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
