# Supabase CLI configuration. `supabase link --project-ref <ref>` then
# `supabase db push` and `supabase functions deploy`.
project_id = "kicks"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
# The static site. Add every origin the site is served from (GitHub Pages,
# a custom domain, localhost for development) — Supabase refuses redirects
# to anything not listed here.
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/auth/callback/",
  "http://127.0.0.1:3000/auth/callback/",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
# Magic links only — no passwords to leak.
otp_length = 6
otp_expiry = 900

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
skip_nonce_check = false

[auth.external.github]
enabled = true
client_id = "env(SUPABASE_AUTH_GITHUB_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GITHUB_SECRET)"

[edge_runtime]
enabled = true
policy = "per_worker"

# Stripe signs its own requests; there is no Supabase JWT on a webhook.
[functions.stripe-webhook]
verify_jwt = false

[functions.create-checkout-session]
verify_jwt = true

[functions.billing-portal]
verify_jwt = true

[functions.delete-account]
verify_jwt = true
