[project]
name = "kicks"
version = "0.2.0"
description = "VAE-powered drum synthesizer — kicks, snares and hi-hats from one pipeline"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.6.0",
    "torchaudio>=2.6.0",
    "soundfile>=0.12",
    "numpy",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "rich",
    "bigvgan>=2.4.1",
    "pyloudnorm",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "typer>=0.15.0",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
    "descript-audio-codec>=1.0.0,<2",
]

[project.scripts]
kicks = "kicks.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kicks"]
